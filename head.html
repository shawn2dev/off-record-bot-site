<meta name="referrer" content="no-referrer"/>
<script nonce="aem">
  (() => {
    const url = new URL(window.location.href);
    if (url.searchParams.has('offrecord_code') || url.searchParams.has('offrecord_error')) {
      window.offRecordAuthLanding = {
        code: url.searchParams.get('offrecord_code'),
        error: url.searchParams.get('offrecord_error'),
      };
      url.searchParams.delete('offrecord_code');
      url.searchParams.delete('offrecord_error');
      window.history.replaceState(window.history.state, '', `${url.pathname}${url.search}${url.hash}`);
    }
  })();
</script>
<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none'; frame-src 'self' https:; require-trusted-types-for 'script';"
  move-to-http-header="true"
/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
<link rel="stylesheet" href="/styles/styles.css"/>
